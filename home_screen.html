<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Screen - 静夜思</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Heroicons CDN (if still used for specific icons not covered by shared SVG, otherwise can be removed) -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/heroicons@1.0.6/outline/index.js"></script> -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/heroicons@1.0.6/solid/index.js"></script> -->
    <link rel="stylesheet" href="shared_styles.css">
    <style>
        /* Page-specific styles for Home Screen */
        .app-screen { /* Specific padding for home screen if different */
             padding-bottom: 83px; /* Ensure this is consistent or overridden if needed */
        }

        .content-section {
            margin-bottom: 28px; /* Slightly more spacing between sections */
            padding-left: 20px;
        }
        .content-section:last-of-type {
             margin-bottom: 0;
             padding-bottom: 24px;
        }
        .content-section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #F5F5F5; /* Moonlight White */
        }
        .horizontal-scroll-list {
            display: flex;
            overflow-x: auto;
            padding-bottom: 16px;
            /* margin-right: -20px; /* Let content scroll to edge of screen */
            /* padding-right: 20px; /* Add back padding for last item */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .horizontal-scroll-list::-webkit-scrollbar { display: none; }
        .horizontal-scroll-list .content-card:last-child {
            margin-right: 20px; /* Ensure last card has padding from edge of scroll container */
        }

        /* Status bar for home screen (if different from splash) */
        .status-bar {
             background-color: #2A2D43; /* Matches top of gradient */
        }

    </style>
    <!-- Google Fonts is in shared_styles.css -->
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

    <div class="mockup-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="signals flex items-center space-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.054A.5.5 0 017.5 15.5V12a.5.5 0 01.5-.5h8a.5.5 0 01.5.5v3.5a.5.5 0 01-.611.446l-3.89-1.945a.5.5 0 00-.468 0l-3.93 1.95zM12 12V9" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M12 21V10.5M5.636 5.636a9 9 0 000 12.728" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5L7.03 9.754l-.001.004-.002.003-.005.007a1 1 0 00.874 1.482h4.992l.005-.007.002-.003.001-.004a1 1 0 00-.874-1.482A29.027 29.027 0 0010 7z" clip-rule="evenodd" /></svg>
            </div>
        </div>

        <div class="app-screen">
            <!-- Top Navigation -->
            <div class="top-nav">
                <span class="app-logo-text">静夜思</span>
                <!-- Settings Icon (Cog) - Consistent with design doc -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.646.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.438.995s.145.755.438.995l1.003.827c.432.355.537.957.26 1.431l-1.296 2.247a1.125 1.125 0 01-1.37.49l-1.217-.456c-.355-.133-.75-.072-1.075.124a6.57 6.57 0 01-.22.127c-.333.184-.583.496-.646.87l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.646-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.37-.49l-1.296-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.437-.995s-.145-.755-.437-.995l-1.004-.827a1.125 1.125 0 01-.26-1.431l1.296-2.247a1.125 1.125 0 011.37-.49l1.217.456c.355.133.75.072 1.076-.124.072-.044.146-.087.22-.127.333-.184.582-.496.646-.87l.213-1.281z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>

            <!-- Personalized Recommendation Section -->
            <div class="content-section">
                <h2 class="content-section-title">为你推荐</h2>
                <div class="horizontal-scroll-list">
                    <!-- Card 1 -->
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x200?calm,nature" alt="Recommended Content 1">
                        <div class="card-info">
                            <h3 class="card-title">宁静之夜</h3>
                            <p class="card-desc">深度放松，安然入眠</p>
                        </div>
                    </div>
                    <!-- Card 2 -->
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x201?stars,sky" alt="Recommended Content 2">
                        <div class="card-info">
                            <h3 class="card-title">星空冥想</h3>
                            <p class="card-desc">跟随星光，释放压力</p>
                        </div>
                    </div>
                    <!-- Card 3 -->
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x202?forest,mist" alt="Recommended Content 3">
                        <div class="card-info">
                            <h3 class="card-title">森林耳语</h3>
                            <p class="card-desc">大自然的疗愈之声</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sleep Stories Section -->
            <div class="content-section">
                <h2 class="content-section-title">睡眠故事</h2>
                <div class="horizontal-scroll-list">
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x200?moon,fantasy" alt="Sleep Story 1">
                        <div class="card-info">
                            <h3 class="card-title">月光下的传说</h3>
                            <p class="card-desc">25分钟</p>
                        </div>
                    </div>
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x201?dream,magic" alt="Sleep Story 2">
                        <div class="card-info">
                            <h3 class="card-title">梦境守护者</h3>
                            <p class="card-desc">30分钟</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meditation Practices Section -->
            <div class="content-section">
                <h2 class="content-section-title">冥想练习</h2>
                <div class="horizontal-scroll-list">
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x200?meditation,zen" alt="Meditation 1">
                        <div class="card-info">
                            <h3 class="card-title">呼吸冥想</h3>
                            <p class="card-desc">15分钟</p>
                        </div>
                    </div>
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x201?yoga,sunrise" alt="Meditation 2">
                        <div class="card-info">
                            <h3 class="card-title">晨间正念</h3>
                            <p class="card-desc">10分钟</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Nature Sounds Section -->
            <div class="content-section">
                <h2 class="content-section-title">自然之声</h2>
                <div class="horizontal-scroll-list">
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x200?rain,window" alt="Nature Sound 1">
                        <div class="card-info">
                            <h3 class="card-title">雨夜低语</h3>
                            <p class="card-desc">循环播放</p>
                        </div>
                    </div>
                    <div class="content-card">
                        <div class="card-image-overlay"></div>
                        <img src="https://source.unsplash.com/random/320x201?ocean,waves" alt="Nature Sound 2">
                        <div class="card-info">
                            <h3 class="card-title">海浪轻抚</h3>
                            <p class="card-desc">循环播放</p>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- End App Screen -->

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <!-- Discover (Active) -->
            <a href="#" class="nav-item active icon-discover">
                <!-- Design Doc: Compass or Star Icon. Using Star (Solid for active) -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.868 2.884c-.321-.772-1.415-.772-1.736 0l-1.83 4.401-4.753.39-3.468 3.468a1 1 0 00.707 1.707l4.753-.39 1.83-4.401 1.83 4.401 4.753.39a1 1 0 00.707-1.707l-3.468-3.468-4.753-.39-1.83-4.401z" clip-rule="evenodd" />
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm0-2a6 6 0 100-12 6 6 0 000 12z" clip-rule="evenodd" />
                </svg>
                <span>发现</span>
            </a>
            <!-- My Favorites -->
            <a href="#" class="nav-item icon-favorites">
                <!-- Design Doc: Heart Icon (Outline for inactive) -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                </svg>
                <span>我的收藏</span>
            </a>
            <!-- Playing Queue -->
            <a href="#" class="nav-item icon-queue">
                <!-- Design Doc: Playlist or Headphones Icon. Using a simple list/queue icon (Outline for inactive) -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" />
                </svg>
                <span>播放队列</span>
            </a>
            <!-- Profile/Me -->
            <a href="#" class="nav-item icon-profile">
                <!-- Design Doc: Simple person/user icon (Outline for inactive) -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                <span>个人中心</span>
            </a>
        </div>
    </div>

</body>
</html>
