<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - 静夜思</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            overflow: hidden;
            font-family: 'Nunito Sans', sans-serif;
        }
        .mockup-frame {
            width: 375px;
            height: 812px;
            border: 16px solid black;
            border-radius: 36px;
            box-shadow: 0 0 24px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            background-color: #1C1E2D; /* Base dark background */
        }
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #F5F5F5;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background-color: #2A2D43; /* Matches top part of gradient/title bars */
        }
        .status-bar .time { font-size: 15px; font-weight: 600; }
        .status-bar .signals svg { height: 12px; width: 12px; }

        .app-screen {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            background: linear-gradient(to bottom, #2A2D43, #1C1E2D);
            color: #F5F5F5;
            padding-top: 44px; /* Status bar */
            padding-bottom: 83px; /* Bottom nav */
            box-sizing: border-box;
        }
        .app-screen::-webkit-scrollbar { display: none; /* Safari and Chrome */ }

        .profile-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(245, 245, 245, 0.1); /* Subtle border */
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #E6E6FA; /* Light Lavender placeholder */
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #2A2D43;
        }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: 600; color: #F5F5F5; }

        .settings-list { margin-top: 20px; }
        .list-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            color: #F5F5F5;
            text-decoration: none;
            border-bottom: 1px solid rgba(245, 245, 245, 0.05); /* Even more subtle border */
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .icon {
            width: 22px; height: 22px; margin-right: 16px; color: #E6E6FA; /* Light Lavender for icons */
        }
        .list-item span { flex-grow: 1; font-size: 16px; }
        .list-item .chevron { width: 18px; height: 18px; color: #A0AEC0; /* Muted chevron */ }

        .logout-button-container {
            padding: 30px 20px;
        }
        .logout-button {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background-color: transparent;
            border: 1px solid #E6E6FA; /* Light Lavender border */
            color: #E6E6FA; /* Light Lavender text */
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .logout-button:hover { background-color: rgba(230, 230, 250, 0.1); }


        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            border-top: 1px solid #E5E7EB;
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #A0AEC0;
            font-size: 10px;
        }
        .nav-item .icon { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-item.active { color: #2A2D43; }
        .nav-item.active .icon { color: #2A2D43; }

    </style>
</head>
