<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - 静夜思</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            overflow: hidden;
            font-family: 'Nunito Sans', sans-serif;
        }
        .mockup-frame {
            width: 375px;
            height: 812px;
            border: 16px solid black;
            border-radius: 36px;
            box-shadow: 0 0 24px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            background-color: #1C1E2D; /* Base dark background */
        }
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #F5F5F5;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background-color: #2A2D43; /* Top of gradient for status/title bar area */
        }
        .status-bar .time { font-size: 15px; font-weight: 600; }
        .status-bar .signals svg { height: 12px; width: 12px; }

        .app-screen {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            background: linear-gradient(to bottom, #2A2D43, #1C1E2D);
            color: #F5F5F5;
            padding-top: 44px; /* Status bar */
            padding-bottom: 83px; /* Bottom nav */
            box-sizing: border-box;
        }
        .app-screen::-webkit-scrollbar { display: none; /* Safari and Chrome */ }

        .title-bar {
            height: 56px;
            display: flex;
            justify-content: center; /* Center title */
            align-items: center;
            padding: 0 20px;
            /* background-color: #2A2D43; /* Matches status bar bg */
            color: #F5F5F5;
        }
        .title-bar .page-title { font-size: 20px; font-weight: 600; }

        .favorites-list { padding: 16px 20px; }
        .favorite-item {
            display: flex;
            align-items: center;
            background-color: #2A2D43; /* Card background */
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .favorite-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 16px;
        }
        .item-info { flex-grow: 1; }
        .item-title { font-size: 16px; font-weight: 600; color: #F5F5F5; margin-bottom: 4px; }
        .item-category { font-size: 12px; color: #E6E6FA; } /* Light Lavender */
        .item-duration { font-size: 12px; color: #E6E6FA; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #E6E6FA; /* Light Lavender */
        }
        .empty-state .icon {
            width: 60px; height: 60px; margin: 0 auto 20px auto; color: #F5F5F5;
        }
        .empty-state p { font-size: 16px; }


        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            border-top: 1px solid #E5E7EB;
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #A0AEC0;
            font-size: 10px;
        }
        .nav-item .icon { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-item.active { color: #2A2D43; }
        .nav-item.active .icon { color: #2A2D43; }

    </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

    <div class="mockup-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="signals flex items-center space-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M12 21V10.5M5.636 5.636a9 9 0 000 12.728" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v4.768l-2.121-2.122a1 1 0 00-1.414 1.414L8.707 11H4a1 1 0 100 2h4.707l-2.243 2.243a1 1 0 101.414 1.414L10 13.414V18a1 1 0 102 0v-4.586l2.121 2.121a1 1 0 001.414-1.414L11.293 11H16a1 1 0 100-2h-4.707l2.243-2.243a1 1 0 00-1.414-1.414L10 8.232V5z" /></svg>

        </div>

        <div class="app-screen">
            <div class="title-bar">
                <h1 class="page-title">我的收藏</h1>

            <!-- Favorites List -->
            <div class="favorites-list">
                <!-- Favorite Item 1 -->
                <div class="favorite-item">
                    <img src="https://source.unsplash.com/random/120x120?moon,stars" alt="Favorite Item 1">

                        <h3 class="item-title">星空下的冥想</h3>
                        <p class="item-category">冥想练习</p>

                    <!-- Heroicon: play-circle (solid) as an action -->

                    </svg>
                </div>
                <!-- Favorite Item 2 -->
                <div class="favorite-item">
                    <img src="https://source.unsplash.com/random/120x121?fantasy,forest" alt="Favorite Item 2">

                    </div>
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 hover:text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8.188v3.624a1 1 0 001.555.832l3.197-1.812a1 1 0 000-1.664L9.555 7.168z" clip-rule="evenodd" />
                    </svg>
                </div>

                <!-- Empty State (Uncomment to test) -->

                <div class="empty-state">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                    </svg>
                    <p>你还没有收藏任何内容哦，</p>
                    <p>去发现页看看吧~</p>
                </div>
                -->
            </div>

        </div> <!-- End App Screen -->

        <div class="bottom-nav">
            <a href="#" class="nav-item">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /> <!-- Using a generic home icon for Discover -->
                </svg>
                <span>发现</span>
            </a>
            <a href="#" class="nav-item active">
                <!-- Heroicon: heart (solid) -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                </svg>
                <span>我的收藏</span>

            <a href="#" class="nav-item">
                 <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

</body>
</html>
