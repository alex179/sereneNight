<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playback Screen - 静夜思</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="shared_styles.css">
    <style>
        /* Page-specific styles for Playback Screen */
        .app-screen {
            /* Playback screen usually has no bottom nav bar, so padding-bottom might be less or different */
            padding-bottom: 0; /* Remove default app-screen bottom padding */
        }

        .top-nav-playback {
            /* Styles from previous step, ensure they are compatible with shared_styles.css */
            /* Or move relevant parts to shared_styles.css if they become generic enough */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            height: 56px;
            position: absolute;
            top: 44px; /* Below status bar */
            left: 0;
            right: 0;
            z-index: 20;
            background-color: transparent;
        }
        .top-nav-playback .icon {
            width: 28px;
            height: 28px;
            color: #F5F5F5;
            cursor: pointer;
        }
        .top-nav-playback .title {
            font-size: 18px;
            font-weight: 600;
            color: #F5F5F5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .main-visual-area {
            flex-grow: 1;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #2A2D43, #1C1E2D); /* Fallback gradient */
        }
        .main-visual-area::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
        }

        .controls-area {
            padding: 20px 20px 34px 20px; /* 34px for home indicator area */
            background-color: rgba(28, 30, 45, 0.85); /* #1C1E2D with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .progress-bar-container { margin-bottom: 10px; }
        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: rgba(245, 245, 245, 0.25);
            border-radius: 2.5px;
            overflow: hidden;
            cursor: pointer;
        }
        .progress {
            height: 100%;
            background-color: #E6E6FA; /* Light Lavender */
            border-radius: 2.5px;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #E6E6FA; /* Light Lavender */
            margin-bottom: 20px;
        }

        .playback-buttons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 24px;
        }
        .playback-buttons .icon { /* For skip buttons */
            width: 32px;
            height: 32px;
            color: #F5F5F5;
            cursor: pointer;
        }
        .playback-buttons .play-pause-btn .icon { /* For main play/pause button */
            width: 64px;
            height: 64px;
            color: #F5F5F5;
        }

        .aux-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
         .aux-buttons .icon {
            width: 26px;
            height: 26px;
            color: #F5F5F5;
            cursor: pointer;
            opacity: 0.85;
        }
        .aux-buttons .icon:hover {
            opacity: 1;
        }
        .status-bar { /* Ensure status bar is transparent for playback screen */
            background-color: transparent;
        }
    </style>
    <!-- Google Fonts is in shared_styles.css -->
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

    <div class="mockup-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="signals flex items-center space-x-1">
                <!-- Simplified SVGs for signals -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M12 21V10.5M5.636 5.636a9 9 0 000 12.728" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v4.768l-2.121-2.122a1 1 0 00-1.414 1.414L8.707 11H4a1 1 0 100 2h4.707l-2.243 2.243a1 1 0 101.414 1.414L10 13.414V18a1 1 0 102 0v-4.586l2.121 2.121a1 1 0 001.414-1.414L11.293 11H16a1 1 0 100 2h-4.707l2.243-2.243a1 1 0 00-1.414-1.414L10 8.232V5z" /></svg>
            </div>
        </div>

        <div class="app-screen">
            <!-- Top Navigation -->
            <div class="top-nav-playback">
                <!-- Back Arrow Icon -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
                <span class="title">月光下的传说</span>
                <div class="flex space-x-5"> <!-- Increased spacing for icons -->
                    <!-- Favorite Icon (Heart, outline or solid based on state) -->
                    <svg class="icon" id="favorite-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                    </svg>
                    <!-- Download Icon (Optional) -->
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                </div>
            </div>

            <!-- Main Visual Area -->
            <!-- Background image is applied here, with a ::before pseudo-element for overlay -->
            <div class="main-visual-area" style="background-image: url('https://source.unsplash.com/random/400x850?night,sky,moon');">
                <!-- Content is primarily the background. The ::before pseudo-element creates the dark overlay. -->
            </div>

            <!-- Controls Area -->
            <div class="controls-area">
                <div class="progress-bar-container">
                    <div class="progress-bar"><div class="progress" style="width: 45%;"></div></div> <!-- Example progress -->
                </div>
                <div class="time-display">
                    <span>10:35</span> <!-- Current time -->
                    <span>25:00</span> <!-- Total time -->
                </div>
                <div class="playback-buttons">
                    <!-- Skip Previous Icon (Optional) -->
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.445 14.832A1 1 0 0010 14.135V5.865a1 1 0 00-1.555-.832L2.445 9.168a1 1 0 000 1.664l6 4.000zM11.555 5.168A1 1 0 0010 5.865v8.27a1 1 0 001.555.832l6-4a1 1 0 000-1.664l-6-4z" clip-rule="evenodd" />
                    </svg>

                    <!-- Play/Pause Button -->
            <span class="play-pause-btn" id="play-pause-button" role="button" aria-label="Play/Pause">
                        <!-- Play Icon (Solid) -->
                <svg class="icon icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="false">
                            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm14.024-.983a1.125 1.125 0 010 1.966l-5.603 3.113A1.125 1.125 0 019 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113z" clip-rule="evenodd" />
                        </svg>
                        <!-- Pause Icon (Solid) - Initially hidden -->
                <svg class="icon icon-pause hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zM9 8.25a.75.75 0 00-.75.75v6c0 .414.336.75.75.75h.75a.75.75 0 00.75-.75V9a.75.75 0 00-.75-.75H9zm5.25 0a.75.75 0 00-.75.75v6c0 .414.336.75.75.75H15a.75.75 0 00.75-.75V9a.75.75 0 00-.75-.75h-.75z" clip-rule="evenodd" />
                        </svg>
                    </span>

                    <!-- Skip Next Icon (Optional) -->
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" role="button" aria-label="Next track">
                         <path fill-rule="evenodd" d="M10 14.135V5.865a1 1 0 011.555-.832l6 4a1 1 0 010 1.664l-6 4A1 1 0 0110 14.135zM2.445 9.168A1 1 0 014 8.336V5.865a1 1 0 00-1.555-.832l-6 4a1 1 0 000 1.664l6 3.999A1 1 0 004 14.135V11.664a1 1 0 01-1.555-.832L2.445 9.168z" clip-rule="evenodd" transform="matrix(-1 0 0 1 18.445 0)"/> <!-- Mirrored for skip next -->
                    </svg>
                </div>
                <div class="aux-buttons">
                    <!-- Sleep Timer Icon (Clock) -->
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" role="button" aria-label="Sleep Timer">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <!-- Loop/Shuffle Icon (Example: Loop) -->
             <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" role="button" aria-label="Loop">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    <!-- Playlist/Queue Icon -->
             <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" role="button" aria-label="View Queue">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
