<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PengPengTie</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="text/babel">
        const App = () => {
            const [token, setToken] = React.useState(localStorage.getItem('token'));
            const [pengPengTies, setPengPengTies] = React.useState([]);
            const [name, setName] = React.useState('');
            const [url, setUrl] = React.useState('');
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');

            const fetchPengPengTies = async () => {
                const res = await fetch('/api/pengpengtie', {
                    headers: {
                        'x-auth-token': token
                    }
                });
                const data = await res.json();
                setPengPengTies(data);
            };

            React.useEffect(() => {
                if (token) {
                    fetchPengPengTies();
                }
            }, [token]);

            const handleRegister = async (e) => {
                e.preventDefault();
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    setToken(data.token);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    setToken(data.token);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                setToken(null);
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                await fetch('/api/pengpengtie', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': token
                    },
                    body: JSON.stringify({ name, url })
                });
                fetchPengPengTies();
            };

            const handleDelete = async (id) => {
                await fetch(`/api/pengpengtie/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'x-auth-token': token
                    }
                });
                fetchPengPengTies();
            };

            if (!token) {
                return (
                    <div>
                        <h2>Register</h2>
                        <form onSubmit={handleRegister}>
                            <input type="text" placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} />
                            <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} />
                            <button type="submit">Register</button>
                        </form>
                        <h2>Login</h2>
                        <form onSubmit={handleLogin}>
                            <input type="text" placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} />
                            <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} />
                            <button type="submit">Login</button>
                        </form>
                    </div>
                );
            }

            return (
                <div>
                    <button onClick={handleLogout}>Logout</button>
                    <h2>Create PengPengTie</h2>
                    <form onSubmit={handleCreate}>
                        <input type="text" placeholder="Name" value={name} onChange={(e) => setName(e.target.value)} />
                        <input type="text" placeholder="URL" value={url} onChange={(e) => setUrl(e.target.value)} />
                        <button type="submit">Create</button>
                    </form>
                    <h2>My PengPengTies</h2>
                    <ul>
                        {pengPengTies.map(ppt => (
                            <li key={ppt._id}>
                                {ppt.name} - {ppt.url} - /redirect/{ppt._id}
                                <button onClick={() => handleDelete(ppt._id)}>Delete</button>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
